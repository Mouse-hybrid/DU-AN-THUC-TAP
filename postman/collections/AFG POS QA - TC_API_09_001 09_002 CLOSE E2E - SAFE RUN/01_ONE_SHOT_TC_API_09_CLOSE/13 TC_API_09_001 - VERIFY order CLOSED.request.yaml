$kind: http-request
url: "{{baseUrl}}/api/v1/orders/{{pa_order}}"
method: GET
headers:
  Authorization: Bearer {{pa_token_cashier}}
scripts:
  - type: beforeRequest
    code: "if (!pm.environment.get('pa_order')) { throw new Error('BLOCKED: missing pa_order'); }"
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('GET closed order 200',()=>pm.response.to.have.status(200));
      pm.test('TC_API_09_001: Order remains CLOSED',()=>{const o=pm.response.json();pm.expect(o.id).to.eql(pm.environment.get('pa_order'));pm.expect(o.status).to.eql('CLOSED');});
      if(pm.response.code!==200) pm.execution.setNextRequest(null);
    language: text/javascript
order: 18000
