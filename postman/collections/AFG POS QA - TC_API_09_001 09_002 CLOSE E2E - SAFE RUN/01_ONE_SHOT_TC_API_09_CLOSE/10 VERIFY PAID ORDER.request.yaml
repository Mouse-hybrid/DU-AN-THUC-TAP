$kind: http-request
url: "{{baseUrl}}/api/v1/orders/{{pa_order}}"
method: GET
headers:
  Authorization: Bearer {{pa_token_cashier}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Get order 200",()=>{pm.response.to.have.status(200);});
      pm.test("Order remains PAID",()=>{const x=pm.response.json();pm.expect(x.id).to.eql(pm.environment.get('pa_order'));pm.expect(x.status).to.eql('PAID');pm.expect(x.current_version).to.eql(JSON.parse(pm.environment.get('pa_first_pay')).current_version);});
      if (pm.response.code !== 200) {
          console.warn('Stopping PAY-AUTH run after unexpected HTTP status: ' + pm.response.code + ' in ' + pm.info.requestName);
          pm.execution.setNextRequest(null);
      }
    language: text/javascript
  - type: beforeRequest
    code: |-
      const required = ["pa_order"];
      for (const key of required) {
          if (!pm.environment.get(key)) { throw new Error("BLOCKED: missing " + key + "; do not run downstream requests"); }
      }
    language: text/javascript
order: 16000
