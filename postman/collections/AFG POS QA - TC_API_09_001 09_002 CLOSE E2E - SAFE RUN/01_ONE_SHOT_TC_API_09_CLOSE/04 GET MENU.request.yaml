$kind: http-request
url: "{{baseUrl}}/api/v1/menu?available_only=true"
method: GET
headers:
  Authorization: Bearer {{pa_token_cashier}}
queryParams:
  available_only: "true"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Menu 200",()=>{pm.response.to.have.status(200);});
      pm.test("Available item selected",()=>{const x=pm.response.json();const i=x.find(t=>t.is_available===true&&Number(t.price)>0);pm.expect(i,'No available menu').to.exist;pm.environment.set('pa_menu',i.id);});
      if (pm.response.code !== 200) {
          console.warn('Stopping PAY-AUTH run after unexpected HTTP status: ' + pm.response.code + ' in ' + pm.info.requestName);
          pm.execution.setNextRequest(null);
      }
    language: text/javascript
order: 9000
