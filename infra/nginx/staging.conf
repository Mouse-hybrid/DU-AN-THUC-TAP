# WebSocket: chỉ gửi "Connection: upgrade" khi client thật sự xin upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Các đường dẫn thuộc backend; mọi đường dẫn khác là giao diện FE (SPA).
upstream pos_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    # Bản build FE (frontend/dist) do scripts/deploy-staging.sh chép vào đây.
    root /usr/share/nginx/html;

    # Header proxy dùng chung; location nào tự khai proxy_set_header (WebSocket)
    # thì không kế thừa nên phải khai lại đủ.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Realtime bàn/bếp (BE-S1-07). Thiếu 2 header Upgrade/Connection thì nginx
    # gửi request thường xuống app và handshake WebSocket thất bại.
    location /api/v1/ws {
        proxy_pass http://pos_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Mặc định 60s không có dữ liệu là nginx cắt kết nối; màn bếp có thể im
        # lặng lâu hơn. Client vẫn nên gửi "ping" định kỳ (~30s).
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # JWT đi qua query ?token= (trình duyệt không gắn header được cho
        # WebSocket) — không ghi URL này vào access log.
        access_log off;
    }

    # REST API, Swagger, health check và static của các trang mock cũ.
    location /api/ { proxy_pass http://pos_api; }
    location /docs { proxy_pass http://pos_api; }
    location /redoc { proxy_pass http://pos_api; }
    location = /openapi.json { proxy_pass http://pos_api; }
    location = /health { proxy_pass http://pos_api; }
    location = /ready { proxy_pass http://pos_api; }
    location /static/ { proxy_pass http://pos_api; }

    # Giao diện FE: file có thật thì trả file, đường dẫn của SPA (vd /tables)
    # trả index.html. Chưa deploy FE (thư mục rỗng) thì rơi về backend như cũ.
    location / {
        try_files $uri /index.html @api;
    }

    # File build có hash trong tên -> cache lâu; index.html thì không cache để
    # bản deploy mới có hiệu lực ngay.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location @api {
        proxy_pass http://pos_api;
       
    }
}
