# WebSocket: chỉ gửi "Connection: upgrade" khi client thật sự xin upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    # Realtime bàn/bếp (BE-S1-07). Thiếu 2 header Upgrade/Connection thì nginx
    # gửi request thường xuống app và handshake WebSocket thất bại.
    location /api/v1/ws {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Mặc định 60s không có dữ liệu là nginx cắt kết nối; màn bếp có thể im
        # lặng lâu hơn. Client vẫn nên gửi "ping" định kỳ (~30s).
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # JWT đi qua query ?token= (trình duyệt không gắn header được cho
        # WebSocket) — không ghi URL này vào access log.
        access_log off;
    }

    location / {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
