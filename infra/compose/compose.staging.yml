# Xoay vòng log Docker (ADR 0004, P2-RFI-MON): mỗi container giữ tối đa 5 file x 20 MB.
# Với lượng log staging hiện tại, đủ khoảng 7 ngày; container nào ghi nhiều hơn thì giữ ít ngày
# hơn nhưng không bao giờ làm đầy ổ đĩa. Đổi cấu hình này thì container được tạo lại khi deploy.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  api:
    build:
      context: ../../backend
      args:
        # deploy-staging.sh export 2 biến này trước khi build (GET /version).
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILT_AT: ${BUILT_AT:-unknown}
    restart: unless-stopped
    logging: *default-logging
    environment:
      APP_ENV: staging
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: pos_staging
      DB_USER: pos_app
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-}
      VNPAY_IPN_ENABLED: ${VNPAY_IPN_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [app_net]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: pos_staging
      POSTGRES_USER: pos_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos_app -d pos_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [app_net]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
    volumes:
      - ../nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      # Bản build FE do scripts/deploy-staging.sh chép vào (rỗng = chưa có FE).
      - ${HOME}/pos-staging-frontend:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [app_net]

volumes:
  postgres_data:

networks:
  app_net:
    driver: bridge
