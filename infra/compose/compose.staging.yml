services:
  api:
    build:
      context: ../../backend
    restart: unless-stopped
    environment:
      APP_ENV: staging
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: pos_staging
      DB_USER: pos_app
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [app_net]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pos_staging
      POSTGRES_USER: pos_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos_app -d pos_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [app_net]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [app_net]

volumes:
  postgres_data:

networks:
  app_net:
    driver: bridge
