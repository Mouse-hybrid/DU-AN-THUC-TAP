name: DES-QA-05 Read-only Preflight

on:
  push:
    branches: [ONLY_TESTING]
    paths:
      - '.github/workflows/des-qa-05-readonly-preflight.yml'
      - 'qa/automation/Testing_POS/cypress/e2e/des_qa_05/**'
      - 'qa/automation/Testing_POS/scripts/des05_verify_staging_contract.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qa/automation/Testing_POS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qa/automation/Testing_POS/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit live staging version and OpenAPI against main
        env:
          POS_BASE_URL: http://160.191.47.17
        run: |
          mkdir -p evidence/DES-QA-05
          set -o pipefail
          node scripts/des05_verify_staging_contract.mjs 2>&1 | tee evidence/DES-QA-05/STAGING_VERSION_CONTRACT_CI.log
      - name: Run PF-11 and PF-12 GET orders runtime preflight
        if: always()
        env:
          CYPRESS_POS_BASE_URL: http://160.191.47.17
          CYPRESS_POS_USERNAME: ${{ secrets.DES05_MENU_USERNAME }}
          CYPRESS_POS_PASSWORD: ${{ secrets.DES05_MENU_PASSWORD }}
        run: |
          mkdir -p evidence/DES-QA-05
          set -o pipefail
          npx cypress run --browser electron --headless --config trashAssetsBeforeRuns=false --spec 'cypress/e2e/des_qa_05/des_qa_05_orders_list_readonly_preflight.cy.js' 2>&1 | tee evidence/DES-QA-05/PF-11_to_12_CI.log
      - name: Run PF-13 and PF-14 Kitchen stations read-only preflight
        if: always()
        env:
          CYPRESS_POS_BASE_URL: http://160.191.47.17
        run: |
          mkdir -p evidence/DES-QA-05
          set -o pipefail
          npx cypress run --browser electron --headless --config trashAssetsBeforeRuns=false --spec 'cypress/e2e/des_qa_05/des_qa_05_stations_readonly_preflight.cy.js' 2>&1 | tee evidence/DES-QA-05/PF-13_to_14_CI.log
      - name: Run read-only Preflight
        env:
          CYPRESS_POS_BASE_URL: http://160.191.47.17
          CYPRESS_DES05_MENU_TOKEN: ${{ secrets.DES05_MENU_TOKEN }}
          CYPRESS_POS_USERNAME: ${{ secrets.DES05_MENU_USERNAME }}
          CYPRESS_POS_PASSWORD: ${{ secrets.DES05_MENU_PASSWORD }}
          CYPRESS_EXT_KITCHEN_TOKEN: ${{ secrets.EXT_KITCHEN_TOKEN }}
          CYPRESS_EXT_KITCHEN_USERNAME: ${{ secrets.EXT_KITCHEN_USERNAME }}
          CYPRESS_EXT_KITCHEN_PASSWORD: ${{ secrets.EXT_KITCHEN_PASSWORD }}
          CYPRESS_EXT_REFIRE_SUPERVISOR_TOKEN: ${{ secrets.EXT_REFIRE_SUPERVISOR_TOKEN }}
          CYPRESS_EXT_REFIRE_SUPERVISOR_USERNAME: ${{ secrets.EXT_REFIRE_SUPERVISOR_USERNAME }}
          CYPRESS_EXT_REFIRE_SUPERVISOR_PASSWORD: ${{ secrets.EXT_REFIRE_SUPERVISOR_PASSWORD }}
          CYPRESS_EXT_REFIRE_ORDER_ID: ${{ vars.EXT_REFIRE_ORDER_ID }}
        run: |
          mkdir -p evidence/DES-QA-05
          set -o pipefail
          npx cypress run --browser electron --headless --spec 'cypress/e2e/des_qa_05/des_qa_05_kds_refire_readonly_preflight.cy.js' 2>&1 | tee evidence/DES-QA-05/PF-01_to_04_CI.log
      - name: Run PF-15 and PF-16 authenticated station preflight
        if: always()
        env:
          CYPRESS_POS_BASE_URL: http://160.191.47.17
          CYPRESS_EXT_KITCHEN_USERNAME: ${{ secrets.EXT_KITCHEN_USERNAME }}
          CYPRESS_EXT_KITCHEN_PASSWORD: ${{ secrets.EXT_KITCHEN_PASSWORD }}
        run: |
          mkdir -p evidence/DES-QA-05
          set -o pipefail
          npx cypress run --browser electron --headless --config trashAssetsBeforeRuns=false --spec 'cypress/e2e/des_qa_05/des_qa_05_stations_authenticated_preflight.cy.js' 2>&1 | tee evidence/DES-QA-05/PF-15_to_16_CI.log
      - name: Run TC-011 to TC-015 safe guards
        if: always()
        env:
          CYPRESS_POS_BASE_URL: http://160.191.47.17
          CYPRESS_DES05_TC012_RUN: ''
          CYPRESS_DES05_TC013_RUN: ''
          CYPRESS_DES05_TC014_RUN: ''
          CYPRESS_DES05_TC015_RUN: ''
        run: |
          mkdir -p evidence/DES-QA-05
          set -o pipefail
          npx cypress run --browser electron --headless --config trashAssetsBeforeRuns=false --spec 'cypress/e2e/des_qa_05/des_qa_05_tc_011_modifier_contract_preflight.cy.js,cypress/e2e/des_qa_05/des_qa_05_tc_012_start_cooking_isolated.cy.js,cypress/e2e/des_qa_05/des_qa_05_tc_013_mark_ready_isolated.cy.js,cypress/e2e/des_qa_05/des_qa_05_tc_014_pickup_served_isolated.cy.js,cypress/e2e/des_qa_05/des_qa_05_tc_015_backward_transition_isolated.cy.js' 2>&1 | tee evidence/DES-QA-05/TC-011_to_015_CI.log
      - name: Run PF-06 partial-ready data preflight
        if: always()
        env:
          CYPRESS_POS_BASE_URL: http://160.191.47.17
          CYPRESS_EXT_REFIRE_SUPERVISOR_USERNAME: ${{ secrets.EXT_REFIRE_SUPERVISOR_USERNAME }}
          CYPRESS_EXT_REFIRE_SUPERVISOR_PASSWORD: ${{ secrets.EXT_REFIRE_SUPERVISOR_PASSWORD }}
          CYPRESS_DES05_TC016_ORDER_ID: ${{ vars.DES05_TC016_ORDER_ID }}
          CYPRESS_DES05_TC016_READY_ITEM_ID: ${{ vars.DES05_TC016_READY_ITEM_ID }}
          CYPRESS_DES05_TC016_PENDING_ITEM_ID: ${{ vars.DES05_TC016_PENDING_ITEM_ID }}
        run: |
          mkdir -p evidence/DES-QA-05
          set -o pipefail
          npx cypress run --browser electron --headless --config trashAssetsBeforeRuns=false --spec 'cypress/e2e/des_qa_05/des_qa_05_tc_016_expeditor_partial_ready_preflight.cy.js' 2>&1 | tee evidence/DES-QA-05/PF-06_CI.log
      - name: Run PF-07 all-ready data preflight
        if: always()
        env:
          CYPRESS_POS_BASE_URL: http://160.191.47.17
          CYPRESS_EXT_REFIRE_SUPERVISOR_USERNAME: ${{ secrets.EXT_REFIRE_SUPERVISOR_USERNAME }}
          CYPRESS_EXT_REFIRE_SUPERVISOR_PASSWORD: ${{ secrets.EXT_REFIRE_SUPERVISOR_PASSWORD }}
          CYPRESS_DES05_TC017_ORDER_ID: ${{ vars.DES05_TC017_ORDER_ID }}
        run: |
          mkdir -p evidence/DES-QA-05
          set -o pipefail
          npx cypress run --browser electron --headless --config trashAssetsBeforeRuns=false --spec 'cypress/e2e/des_qa_05/des_qa_05_tc_017_expeditor_all_ready_preflight.cy.js' 2>&1 | tee evidence/DES-QA-05/PF-07_CI.log
      - name: Run PF-08 Expeditor action contract preflight
        if: always()
        env:
          CYPRESS_POS_BASE_URL: http://160.191.47.17
        run: |
          mkdir -p evidence/DES-QA-05
          set -o pipefail
          npx cypress run --browser electron --headless --config trashAssetsBeforeRuns=false --spec 'cypress/e2e/des_qa_05/des_qa_05_tc_018_expeditor_rbac_contract_preflight.cy.js' 2>&1 | tee evidence/DES-QA-05/PF-08_CI.log
      - name: Run TC-019 Refire safe guard
        if: always()
        env:
          CYPRESS_POS_BASE_URL: http://160.191.47.17
          CYPRESS_DES05_TC019_RUN: ''
          CYPRESS_DES05_TC019_CLEANUP_CONFIRMED: ''
        run: |
          mkdir -p evidence/DES-QA-05
          set -o pipefail
          npx cypress run --browser electron --headless --config trashAssetsBeforeRuns=false --spec 'cypress/e2e/des_qa_05/des_qa_05_tc_019_refire_once_isolated.cy.js' 2>&1 | tee evidence/DES-QA-05/TC-019_CI.log
      - name: Run TC-020 Refire retry safe guard
        if: always()
        env:
          CYPRESS_POS_BASE_URL: http://160.191.47.17
          CYPRESS_DES05_TC020_RUN: ''
          CYPRESS_DES05_TC020_CLEANUP_CONFIRMED: ''
        run: |
          mkdir -p evidence/DES-QA-05
          set -o pipefail
          npx cypress run --browser electron --headless --config trashAssetsBeforeRuns=false --spec 'cypress/e2e/des_qa_05/des_qa_05_tc_020_refire_retry_isolated.cy.js' 2>&1 | tee evidence/DES-QA-05/TC-020_CI.log
      - name: Run TC-021 Refire subtotal safe guard
        if: always()
        env:
          CYPRESS_POS_BASE_URL: http://160.191.47.17
          CYPRESS_DES05_TC021_RUN: ''
          CYPRESS_DES05_TC021_CLEANUP_CONFIRMED: ''
        run: |
          mkdir -p evidence/DES-QA-05
          set -o pipefail
          npx cypress run --browser electron --headless --config trashAssetsBeforeRuns=false --spec 'cypress/e2e/des_qa_05/des_qa_05_tc_021_refire_subtotal_isolated.cy.js' 2>&1 | tee evidence/DES-QA-05/TC-021_CI.log
      - name: Run TC-022 unauthorized Refire safe guard
        if: always()
        env:
          CYPRESS_POS_BASE_URL: http://160.191.47.17
          CYPRESS_DES05_TC022_RUN: ''
          CYPRESS_DES05_TC022_CLEANUP_CONFIRMED: ''
        run: |
          mkdir -p evidence/DES-QA-05
          set -o pipefail
          npx cypress run --browser electron --headless --config trashAssetsBeforeRuns=false --spec 'cypress/e2e/des_qa_05/des_qa_05_tc_022_refire_unauthorized_isolated.cy.js' 2>&1 | tee evidence/DES-QA-05/TC-022_CI.log
      - name: Run TC-023 invalid Refire state safe guard
        if: always()
        env:
          CYPRESS_POS_BASE_URL: http://160.191.47.17
          CYPRESS_DES05_TC023_RUN: ''
          CYPRESS_DES05_TC023_CLEANUP_CONFIRMED: ''
        run: |
          mkdir -p evidence/DES-QA-05
          set -o pipefail
          npx cypress run --browser electron --headless --config trashAssetsBeforeRuns=false --spec 'cypress/e2e/des_qa_05/des_qa_05_tc_023_refire_invalid_state_isolated.cy.js' 2>&1 | tee evidence/DES-QA-05/TC-023_CI.log
      - name: Run TC-024 second Refire safe guard
        if: always()
        env:
          CYPRESS_POS_BASE_URL: http://160.191.47.17
          CYPRESS_DES05_TC024_RUN: ''
          CYPRESS_DES05_TC024_CLEANUP_CONFIRMED: ''
        run: |
          mkdir -p evidence/DES-QA-05
          set -o pipefail
          npx cypress run --browser electron --headless --config trashAssetsBeforeRuns=false --spec 'cypress/e2e/des_qa_05/des_qa_05_tc_024_second_refire_isolated.cy.js' 2>&1 | tee evidence/DES-QA-05/TC-024_CI.log
      - name: Run PF-09 and PF-10 TC-025 E2E readiness
        if: always()
        env:
          CYPRESS_POS_BASE_URL: http://160.191.47.17
          CYPRESS_EXT_KITCHEN_TOKEN: ${{ secrets.EXT_KITCHEN_TOKEN }}
          CYPRESS_EXT_KITCHEN_USERNAME: ${{ secrets.EXT_KITCHEN_USERNAME }}
          CYPRESS_EXT_KITCHEN_PASSWORD: ${{ secrets.EXT_KITCHEN_PASSWORD }}
        run: |
          mkdir -p evidence/DES-QA-05
          set -o pipefail
          npx cypress run --browser electron --headless --config trashAssetsBeforeRuns=false --spec 'cypress/e2e/des_qa_05/des_qa_05_tc_025_e2e_readiness_preflight.cy.js' 2>&1 | tee evidence/DES-QA-05/PF-09_to_10_CI.log
      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: des-qa-05-preflight-evidence
          path: |
            qa/automation/Testing_POS/cypress/screenshots/
            qa/automation/Testing_POS/cypress/videos/
            qa/automation/Testing_POS/evidence/DES-QA-05/*.log
          if-no-files-found: ignore
          retention-days: 14
