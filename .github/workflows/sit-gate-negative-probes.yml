name: SIT controlled failure probes
on:
  push:
    branches: [qa/sit-gate-negative-probes]
    paths: [.github/workflows/sit-gate-negative-probes.yml]
permissions:
  contents: read
jobs:
  deliberate-failure:
    name: Expected rejection - ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        variant: [failed_step, cleanup_failed]
    env:
      QA_SOURCE_SHA: 613728752a8a497db9ea07a4c77ebb484ed32d50
      PROBE_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 613728752a8a497db9ea07a4c77ebb484ed32d50
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create deliberately invalid report without staging or secrets
        working-directory: qa/automation/Testing_POS
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync,mkdirSync} from 'node:fs';
          const r=JSON.parse(readFileSync('evidence/sit-pos-001/history/SIT_POS_001_RUN-20261127133953699-SITPOS001.json','utf8'));
          r.source_run_id=r.run_id;
          r.run_id='RUN-CONTROLLED-'+process.env.PROBE_VARIANT.replaceAll('_','-');
          r.scope='CONTROLLED OFFLINE FAILURE PROBE, not a staging business execution';
          if(process.env.PROBE_VARIANT==='failed_step')r.steps[13].status='FAILED';
          else r.cleanup_pass=false;
          const dir='evidence/sit-probe';
          mkdirSync(dir,{recursive:true});
          writeFileSync(dir+'/SIT_POS_001_CONTROLLED.json',JSON.stringify(r,null,2));
          NODE
      - name: Require nonzero rejection from the real SIT checker
        working-directory: qa/automation/Testing_POS
        run: node scripts/check_sit_gate.mjs evidence/sit-probe d6ee04a173c74530653c5df394dd439c92369eaf
      - name: Preserve rejected input, summary and revision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controlled-sit-rejection-${{ matrix.variant }}-${{ github.run_id }}
          path: qa/automation/Testing_POS/evidence/sit-probe/
          if-no-files-found: error
          retention-days: 14
