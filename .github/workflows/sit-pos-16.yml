name: SIT POS 16 steps (staging, no CD)
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Full deployed staging commit SHA
        required: true
        type: string
  push:
    branches: [qa/sit-16-ci]
    paths:
      - .github/workflows/sit-pos-16.yml
      - qa/automation/Testing_POS/test_playwright_version/sit_pos_001_16_steps.spec.ts
permissions:
  contents: read
jobs:
  sit:
    runs-on: [self-hosted, staging]
    timeout-minutes: 25
    concurrency:
      group: staging
      cancel-in-progress: false
    env:
      BASE_URL: http://160.191.47.17
      POS_EXPECTED_COMMIT: ${{ inputs.expected_commit || 'd6ee04a173c74530653c5df394dd439c92369eaf' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: qa-sit-${{ github.run_id }}
          persist-credentials: false
      - name: Verify required PIN and sandbox connectivity
        working-directory: /tmp
        env:
          S2_STAGING_PIN: ${{ secrets.S2_STAGING_PIN }}
        shell: bash
        run: |
          test -n "$S2_STAGING_PIN"
          [[ "$POS_EXPECTED_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          curl -fsS -o /dev/null --connect-timeout 8 --max-time 15 'https://sandbox.vnpayment.vn/apis/vnpay-demo/'
      - name: Execute one owned 16-step flow in isolated Chromium container
        env:
          S2_STAGING_PIN: ${{ secrets.S2_STAGING_PIN }}
        shell: bash
        run: |
          docker run --rm --shm-size=1g \
            --user "$(id -u):$(id -g)" \
            --env BASE_URL --env POS_EXPECTED_COMMIT --env S2_STAGING_PIN \
            --env CI=true --env CYPRESS_INSTALL_BINARY=0 \
            --env npm_config_cache=/tmp/qa-sit-npm-cache \
            --volume "$GITHUB_WORKSPACE/qa-sit-${{ github.run_id }}:/work" \
            --workdir /work/qa/automation/Testing_POS \
            mcr.microsoft.com/playwright:v1.63.0-noble \
            bash -c 'npm ci && npx --no-install playwright test test_playwright_version/sit_pos_001_16_steps.spec.ts --project=chromium --workers=1 --retries=0 --reporter=dot'
      - name: Upload sanitized SIT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sit-pos-001-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            qa-sit-${{ github.run_id }}/qa/automation/Testing_POS/evidence/sit-pos-001/SIT_POS_001_*.json
            qa-sit-${{ github.run_id }}/qa/automation/Testing_POS/evidence/sit-pos-001/*_qr_receipt.png
            qa-sit-${{ github.run_id }}/qa/automation/Testing_POS/evidence/sit-pos-001/*_payment_totals.png
          if-no-files-found: error
          retention-days: 14
