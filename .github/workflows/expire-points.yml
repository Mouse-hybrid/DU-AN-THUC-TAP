name: Expire loyalty points
# Tru diem het han (Rewards dot 3, specs/002-rewards-dot-3 US2): moi ngay 03:00 gio Viet Nam
# (20:00 UTC) chay scripts/expire_points.py trong container api tren staging. Chay lai khong
# tru them. Bam tay: Actions -> Expire loyalty points -> Run workflow (co the chon dry run).

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Chi in so diem se tru, khong ghi"
        type: boolean
        default: false

permissions:
  contents: read

# Dung chung nhom voi deploy, backup, reset: khong chay giua luc dang deploy/reset.
concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  expire:
    runs-on: [self-hosted, staging]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Khoi phuc .env.staging (khong nam trong git, luu ben ngoai checkout)
        run: cp ~/secrets/pos-staging/.env.staging .env.staging
      - name: Tru diem het han
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=()
          if [ "${DRY_RUN:-false}" = "true" ]; then args+=(--dry-run); fi
          docker compose --env-file .env.staging -f infra/compose/compose.staging.yml \
            exec -T api python scripts/expire_points.py "${args[@]}"
