name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pos_ci
          POSTGRES_PASSWORD: pos_ci
          POSTGRES_DB: pos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pos_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest
      - name: Alembic upgrade head tren Postgres that (khong chi SQLite trong pytest)
        env:
          DATABASE_URL: postgresql+psycopg://pos_ci:pos_ci@localhost:5432/pos_ci
        run: alembic upgrade head

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (chi build de xac nhan Dockerfile hop le, khong push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: pos-backend:ci
      - name: Smoke test - container khoi dong duoc va /health tra 200
        run: |
          docker run -d --name smoke -p 8000:8000 pos-backend:ci
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then
              echo "OK"
              docker stop smoke
              exit 0
            fi
            sleep 2
          done
          echo "Container khong san sang sau 30s"
          docker logs smoke
          docker stop smoke
          exit 1

  deploy-staging:
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, staging]
    steps:
      - uses: actions/checkout@v4
      - name: Khoi phuc .env.staging (khong nam trong git, luu ben ngoai checkout)
        run: cp ~/secrets/pos-staging/.env.staging .env.staging
      - name: Deploy len staging (build, migrate, healthcheck)
        run: bash scripts/deploy-staging.sh
