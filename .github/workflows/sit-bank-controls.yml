name: SIT bank control diagnosis
on:
  push:
    branches: [qa/sit-16-ci]
    paths: [.github/workflows/sit-bank-controls.yml]
permissions:
  contents: read
jobs:
  controls:
    runs-on: [self-hosted, staging]
    timeout-minutes: 2
    concurrency:
      group: staging
      cancel-in-progress: false
    steps:
      - name: Read only bank selection labels from the failed test snapshot
        working-directory: /tmp
        run: |
          python3 - <<'PY'
          import os,pathlib,json,re
          root=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'qa-sit-45996779384/qa/automation/Testing_POS/test-results'
          result=[]
          for path in root.glob('*/error-context.md'):
            for line in path.read_text().splitlines():
              if any(term in line for term in ['NCB','Quốc Dân','Quốc dân']):
                line=re.sub(r'https?://[^\\s)]+','<URL>',line)
                result.append(line[:250])
          print('BANK_CONTROL_LABELS '+json.dumps(result,ensure_ascii=False))
          PY
