name: SIT sandbox network diagnosis
on:
  push:
    branches: [qa/sit-16-ci]
    paths: [.github/workflows/sit-sandbox-network.yml]
permissions:
  contents: read
jobs:
  network:
    runs-on: [self-hosted, staging]
    timeout-minutes: 3
    concurrency:
      group: staging
      cancel-in-progress: false
    steps:
      - name: Probe public sandbox HTTPS without credentials
        working-directory: /tmp
        shell: bash
        run: |
          rc=0
          curl -s -o /dev/null --connect-timeout 8 --max-time 15 \
            --write-out 'VNPay public sandbox HTTP=%{http_code} DNS=%{time_namelookup} TCP=%{time_connect} TLS=%{time_appconnect}\\n' \
            'https://sandbox.vnpayment.vn/apis/vnpay-demo/' | tee -a "$GITHUB_STEP_SUMMARY" || rc=$?
          echo "curl_exit=$rc" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$rc" -eq 0
